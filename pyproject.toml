[tool.poetry]
name = "phobiabot"
version = "0.1.0"
description = "Telegram IPTV Scout & Auto-Poster Platform"
authors = ["ayinlasaheedolayinka-art"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.110.0"
uvicorn = ">=0.28.0"
telethon = ">=1.36.0"
pydantic = ">=2.6.0"
python-multipart = ">=0.0.9"
aiofiles = ">=23.2.0"
websockets = ">=12.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
